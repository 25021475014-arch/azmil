name: Student access checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/student-access/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "index.html"
      - ".github/workflows/student-access-check.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check student access Edge Function
        run: deno check --no-lock supabase/functions/student-access/index.ts


      - name: Run student access unit tests
        run: deno test --no-lock supabase/functions/student-access/logic.test.ts

      - name: Check browser JavaScript syntax and auth flow
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (scripts.length !== 1) throw new Error('Expected one inline application script.');
          writeFileSync('/tmp/bengkel-prosedur.js', scripts[0]);
          if (!scripts[0].includes("type:'magiclink'")) throw new Error('Magic-link token verification type mismatch.');
          if (scripts[0].includes("action:'register'")) throw new Error('Public student registration must remain disabled.');
          if (!scripts[0].includes("action:'create_student'")) throw new Error('Teacher student-provisioning flow missing.');
          NODE
          node --check /tmp/bengkel-prosedur.js

      - name: Confirm initial rollout is limited to VII A
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('supabase/functions/student-access/index.ts', 'utf8');
          if (!source.includes('CLASS_CODES') || !source.includes('./logic.ts')) {
            console.error('Class configuration does not match the VII A-only rollout.');
            process.exit(1);
          }
          console.log('VII A-only class configuration verified.');
          NODE
